<!doctype html>
<!-- Back-press scene preview (not part of the game build). `npm run dev`, then open /scripts/assets/back_preview.html
     ?pos=0.5&pressure=0&impulse=0&kind=ok&step=1&completed=1&w=844&h=390&t=0 ; scripts/assets/back_shot.py drives it.
     Without params it loops a demo: preload, thrust, rebound, next ring. -->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;background:#000}canvas{display:block}#dot{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#ff7a59;pointer-events:none}</style>
</head><body><canvas id="c"></canvas><div id="dot"></div>
<script type="module">
import { createBackScene } from "/src/back/scene.js";
const q = new URLSearchParams(location.search);
const W = +(q.get("w") || innerWidth), H = +(q.get("h") || innerHeight);
const c = document.getElementById("c"); c.style.width = W + "px"; c.style.height = H + "px";
const view = {}; for (const k of ["elev", "az", "fov"]) if (q.has(k)) view[k] = +q.get(k);
if (q.has("target")) view.target = q.get("target").split(",").map(Number);
const s = await createBackScene(c, view);
s.resize(W, H);
window.__back = s;
const dot = document.getElementById("dot");
c.addEventListener("pointerdown", e => { const r = c.getBoundingClientRect(); console.log("pick", s.pickPosition(e.clientX - r.left, e.clientY - r.top)); });
if (q.has("pos")){
  // scripted frames: render a short history so the rebound / pulses can be shown at time t (s) after release
  const st = {position: +q.get("pos"), pressure: +(q.get("pressure") || 0), impulse: +(q.get("impulse") || 0),
              kind: q.get("kind") || "ok", step: +(q.get("step") || 0), completed: +(q.get("completed") || 0)};
  const after = q.has("after") ? +q.get("after") : null;      // seconds after a full thrust (rebound)
  let now = 1000;
  if (after != null){
    const done = q.has("done");       // the thrust completed a ring
    for (let f = 0; f <= 18; f++){ now += 16; s.render({...st, completed: st.completed - (done ? 1 : 0), impulse: Math.sin(Math.PI*f/18), pressure: 1}); }
    const end = now + after*1000;
    while (now < end){ now += 16; s.render({...st, impulse: 0, pressure: 0}); }
  }
  s.render({...st, now});
  const p = s.projectPosition(st.position); dot.style.left = p.x + "px"; dot.style.top = p.y + "px";
  window.__ready = true;
} else {
  let t0 = performance.now(), step = 0, completed = 0;
  (function loop(now){
    const t = ((now - t0)/1000) % 3.2;
    const pos = [0.18, 0.5, 0.82][step];
    const pressure = Math.min(1, t/0.8), impulse = t > 1.0 && t < 1.35 ? Math.sin(Math.PI*(t - 1.0)/0.35) : 0;
    if (t > 1.36 && completed === step){ completed = Math.min(3, completed + 1); }
    if (t < 0.02 && completed > step){ step = (step + 1) % 3; if (step === 0) completed = 0; }
    s.render({now, position: pos, pressure: t < 1.4 ? pressure : 0, impulse, kind: q.get("kind") || "ok", step, completed});
    const p = s.projectPosition(pos); dot.style.left = p.x + "px"; dot.style.top = p.y + "px";
    requestAnimationFrame(loop);
  })(performance.now());
  window.__ready = true;
}
</script></body></html>
