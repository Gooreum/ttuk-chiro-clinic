# ai-bouncer 레포 설정 — 기본값과 같은 형식. 모드·단계를 이름 단위로 교체하거나 추가한다.
#   stages.<단계>.prompt  할 일 / run  통과 조건(exit 0) / items  세부 항목
#   stages.<단계>.choosable  항목을 고르는 방식: ask 사용자에게 묻는다 / auto AI 가 고른다 / all 전부(기본)
# 형식: docs/SCHEMA.md

stages:
  verify:
    run: ["npm test", "npm run build", "npm run e2e", "{ [ -x .venv/bin/python ] || { python3 -m venv .venv && .venv/bin/pip -q install playwright pillow && .venv/bin/python -m playwright install chromium; }; } && npm run build:shot && .venv/bin/python -I scripts/shot.py dist-shot --label new"]
  finalize:
    run: ["test \"$(git branch --show-current)\" != main", "git rev-parse --abbrev-ref \"@{u}\" >/dev/null 2>&1 && test -z \"$(git log \"@{u}..HEAD\" --oneline)\""]
