# ai-bouncer 레포 설정 — 기본값과 같은 형식. 모드·단계를 이름 단위로 교체하거나 추가한다.
#   stages.<단계>.prompt  할 일 / run  통과 조건(exit 0) / items  세부 항목
#   stages.<단계>.choosable  항목을 고르는 방식: ask 사용자에게 묻는다 / auto AI 가 고른다 / all 전부(기본)
# 형식: docs/SCHEMA.md

stages:
  verify:
    items:
      npm-test:
        label: "npm test"
        prompt: "`bouncer record npm-test 'npm test'` 로 돌린다."
        run: ["bouncer passed npm-test"]
      npm-run-build:
        label: "npm run build"
        prompt: "`bouncer record npm-run-build 'npm run build'` 로 돌린다."
        run: ["bouncer passed npm-run-build"]
      npm-run-e2e:
        label: "npm run e2e"
        prompt: "`bouncer record npm-run-e2e 'npm run e2e'` 로 돌린다."
        run: ["bouncer passed npm-run-e2e"]
      x-venv-bin-python-python3-m-ve:
        label: "{ [ -x .venv/bin/python ] || { python3 -m venv .venv && .venv/bin/pip -q install playwright pillow && .venv/bin/python -m playwright install chromium; }; } && npm run build:shot && .venv/bin/python -I scripts/shot.py dist-shot --label new"
        prompt: "`bouncer record x-venv-bin-python-python3-m-ve '{ [ -x .venv/bin/python ] || { python3 -m venv .venv && .venv/bin/pip -q install playwright pillow && .venv/bin/python -m playwright install chromium; }; } && npm run build:shot && .venv/bin/python -I scripts/shot.py dist-shot --label new'` 로 돌린다."
        run: ["bouncer passed x-venv-bin-python-python3-m-ve"]
  finalize:
    run: ["test \"$(git branch --show-current)\" != main", "git rev-parse --git-dir >/dev/null 2>&1 && test -z \"$(git status --porcelain)\"", "git rev-parse --abbrev-ref \"@{u}\" >/dev/null 2>&1 && test -z \"$(git log \"@{u}..HEAD\" --oneline)\""]
